<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blotto Research">
<meta name="theme-color" content="#1a1a18">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Blotto Weekly Research</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --dark: #1a1a18;
  --muted: #888780;
  --border: #d3d1c7;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--dark);
  min-height: 100dvh;
  padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + 28px);
  max-width: 480px;
  margin: 0 auto;
}

.header { margin-bottom: 16px; }
.brand { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.title { font-size: 26px; font-weight: 500; line-height: 1.15; }

.tabs {
  display: flex; gap: 4px;
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 12px; padding: 4px;
  margin-bottom: 20px;
}
.tab {
  flex: 1; text-align: center; font-size: 14px; font-weight: 500;
  padding: 9px 12px; border-radius: 9px; cursor: pointer;
  color: var(--muted); transition: background 0.15s, color 0.15s;
  user-select: none;
}
.tab.active { background: var(--dark); color: #f5f4f0; }

.week-label { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 20px;
  margin-bottom: 20px;
}
.badge-green { background: #EAF3DE; color: #3B6D11; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #639922; }

.section { margin-bottom: 16px; }
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.section-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.section-title { font-size: 16px; font-weight: 500; }

.card { background: var(--surface); border-radius: 12px; border: 0.5px solid var(--border); padding: 14px 16px; margin-bottom: 8px; }
.card-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
.card-body { font-size: 13px; color: #4a4946; line-height: 1.55; }
.card-tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; margin-top: 7px; }
.tag-red { background: #FCEBEB; color: #A32D2D; }
.tag-blue { background: #E6F1FB; color: #185FA5; }
.tag-amber { background: #FAEEDA; color: #854F0B; }

.takeaway { background: var(--dark); color: #f5f4f0; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
.takeaway-label { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #888780; margin-bottom: 6px; }
.takeaway-text { font-size: 14px; line-height: 1.6; color: #e8e7e3; }

/* Archive */
.archive-item {
  background: var(--surface); border-radius: 12px; border: 0.5px solid var(--border);
  margin-bottom: 8px; overflow: hidden;
}
.archive-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; cursor: pointer; user-select: none;
}
.archive-date { font-size: 14px; font-weight: 500; }
.archive-preview { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.archive-chevron { font-size: 14px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
.archive-chevron.open { transform: rotate(180deg); }
.archive-body { display: none; padding: 0 16px 14px; border-top: 0.5px solid var(--border); }
.archive-body.open { display: block; }
.archive-body .section { margin-top: 14px; }
.archive-body .takeaway { margin-top: 14px; margin-bottom: 0; }

.empty-state { background: var(--surface); border-radius: 12px; border: 0.5px solid var(--border); padding: 32px 20px; text-align: center; }
.empty-icon { font-size: 32px; margin-bottom: 12px; }
.empty-title { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
.empty-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }

.divider { height: 0.5px; background: var(--border); margin: 20px 0; }
.footer-text { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">Blotto Games</div>
  <div class="title">Weekly Research</div>
</div>

<div class="tabs">
  <div class="tab active" id="tab-this" onclick="switchTab('this')">This Week</div>
  <div class="tab" id="tab-archive" onclick="switchTab('archive')">Previous Weeks</div>
</div>

<!-- THIS WEEK -->
<div id="view-this">
  <div class="badge badge-green">
    <div class="dot"></div>
    <span>Updates every Monday at 8am</span>
  </div>
  <div class="week-label" id="week-label"></div>
  <div id="content-this"></div>
</div>

<!-- ARCHIVE -->
<div id="view-archive" style="display:none;">
  <div id="content-archive"></div>
</div>

<div class="divider"></div>
<div class="footer-text">
  Competitors &middot; Publishers &middot; Market Trends<br>
  Full reports in Outputs &rsaquo; Blotto Games &rsaquo; Research
</div>

rategic unit combat. Crowded space. Bar Fight needs a clear differentiator \u2014 the drinking mechanic integration is the obvious one none of these have.", "tag": "competitor"}, {"name": "Brawlhalla: The Card Game \u2014 Maestro Media/FLYOS", "body": "Kickstarter November 2025. 2\u20134 players. IP-backed fighting card game with tactical combo-based combat. Relevant to Fixed Fight as another entry in the competitive fighting card game space. IP advantage is significant \u2014 harder to compete with on name recognition alone.", "tag": "competitor"}], "publishers": [{"name": "Osprey Games", "body": "Oxford, UK. Publishes social and thematic games \u2014 Wavelength, Inhuman Conditions, Undaunted. Exhibiting at UKGE 2026 in Birmingham (29\u201331 May). Wargame submissions formally open; board game enquiries welcomed. Noir and thematic tone of Drunk Detective fits their aesthetic. Best approached directly ahead of UKGE.", "tag": "uk"}, {"name": "Stonemaier Games", "body": "US, international distribution. Open for submissions. Specifically looking for light, social, highly replayable games supporting 2\u20138 players with easy drop-in play. Drunk Detective fits the brief better than Fixed Fight. Requires sell sheet and short gameplay video.", "tag": "open"}, {"name": "Big Potato Games", "body": "London, UK. Publisher behind Scrawl, Bucket of Doom, Herd Mentality. Leans into TikTok and content creator marketing. No formal open submissions \u2014 direct outreach is the route in. Drunk Detective's social and party DNA fits squarely in their lane.", "tag": "uk"}, {"name": "Dranda Games", "body": "Birmingham, UK. Award-winning indie publisher \u2014 5 UKGE awards, Dice Tower Seal of Excellence. Actively accepting submissions in 2025. Smaller than Osprey but UK-based and well-regarded. Worth approaching if the bigger publishers don't bite.", "tag": "open"}], "trends": [{"name": "The crime-plus-drinking format is proven and paying", "body": "Murder on the Rocks raised over $100,000 on Kickstarter in 2025 with TikTok-driven marketing. Direct validation that Drunk Detective's core concept has a paying audience. The pressing question is differentiation \u2014 Drunk Detective needs a confident answer to how it differs before any pitch or campaign."}, {"name": "Kickstarter is cooling; Gamefound is rising fast", "body": "Kickstarter ran 3,200 successful tabletop campaigns in 2024 raising $185.4M \u2014 down roughly 2.7% year on year. Gamefound grew 49% to $85M and now holds 6 of the top 10 most-funded tabletop campaigns of 2024. Gamefound then acquired Indiegogo. For a premium-positioned game like Drunk Detective, Gamefound is worth serious consideration over Kickstarter."}, {"name": "UKGE 2026 is six weeks away", "body": "The UK Games Expo runs 29\u201331 May in Birmingham \u2014 600 exhibitors and 53,000 visitors expected. Osprey Games and Big Potato will be exhibiting. Publishers take designer meetings at UKGE. If Drunk Detective is playtestable, this is the best face-to-face publisher opportunity of the year. Decision needed in the next week or two."}]}; /* __RESEARCH_DATA__ */

function formatDate(str) {
  try {
    return new Date(str).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e) { return str; }
}

function shortDate(str) {
  try {
    return new Date(str).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  } catch(e) { return str; }
}

function tagHtml(tag) {
  const map = {

    closed:     ['tag-red',  'Closed submissions']
  };
  if (!tag || !map[tag]) return '';
  return `<span class="card-tag ${map[tag][0]}">${map[tag][1]}</span>`;
}
