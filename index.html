<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Blotto Research">
<meta name="theme-color" content="#1a1a18">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Blotto Weekly Research</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --dark: #1a1a18;
  --muted: #888780;
  --border: #d3d1c7;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--dark);
  min-height: 100dvh;
  padding: calc(var(--safe-top) + 20px) 16px calc(var(--safe-bottom) + 28px);
  max-width: 480px;
  margin: 0 auto;
}

.header { margin-bottom: 16px; }
.brand { font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.title { font-size: 26px; font-weight: 500; line-height: 1.15; }

/* 4-tab layout */
.tabs {
  display: flex; gap: 3px;
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 12px; padding: 4px;
  margin-bottom: 20px;
}
.tab {
  flex: 1; text-align: center; font-size: 12px; font-weight: 500;
  padding: 8px 4px; border-radius: 9px; cursor: pointer;
  color: var(--muted); transition: background 0.15s, color 0.15s;
  user-select: none; white-space: nowrap;
}
.tab.active { background: var(--dark); color: #f5f4f0; }

.week-label { font-size: 13px; color: var(--muted); margin-bottom: 16px; }

.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 500; padding: 6px 12px; border-radius: 20px;
  margin-bottom: 16px;
}
.badge-green { background: #EAF3DE; color: #3B6D11; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #639922; }

/* Game filter pills */
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-pill {
  font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 20px;
  cursor: pointer; user-select: none; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); transition: all 0.15s;
}
.filter-pill.active { background: var(--dark); color: #f5f4f0; border-color: var(--dark); }

/* Search bar */
.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 10px; padding: 10px 14px; margin-bottom: 16px;
}
.search-bar input {
  border: none; outline: none; background: transparent;
  font-size: 14px; color: var(--dark); flex: 1; font-family: inherit;
}
.search-bar input::placeholder { color: var(--muted); }
.search-icon { color: var(--muted); font-size: 14px; }

.section { margin-bottom: 16px; }
.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.section-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.section-title { font-size: 16px; font-weight: 500; }

/* Cards */
.card { background: var(--surface); border-radius: 12px; border: 0.5px solid var(--border); padding: 14px 16px; margin-bottom: 8px; }
.card.bookmarked { border-color: #639922; }
.card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.card-name { font-size: 14px; font-weight: 500; flex: 1; }
.card-actions { display: flex; gap: 10px; flex-shrink: 0; padding-top: 1px; }
.card-btn { background: none; border: none; cursor: pointer; font-size: 16px; padding: 0; line-height: 1; color: var(--muted); }
.card-btn.on { color: #1a1a18; }
.card-body { font-size: 13px; color: #4a4946; line-height: 1.55; }
.card-tag { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; margin-top: 7px; }
.tag-red   { background: #FCEBEB; color: #A32D2D; }
.tag-blue  { background: #E6F1FB; color: #185FA5; }
.tag-amber { background: #FAEEDA; color: #854F0B; }

/* Note on card */
.card-note {
  font-size: 12px; color: #555; background: #f9f9f7;
  border-left: 2px solid #d3d1c7; padding: 6px 8px;
  border-radius: 0 4px 4px 0; margin-top: 8px; line-height: 1.5; font-style: italic;
}

/* Game tag pills on cards */
.card-game-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.game-tag-pill {
  font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px;
  cursor: pointer; user-select: none;
  border: 1px solid var(--border); color: var(--muted); background: var(--bg);
  transition: all 0.15s;
}
.game-tag-pill.active { background: var(--dark); color: #f5f4f0; border-color: var(--dark); }

/* Takeaway */
.takeaway { background: var(--dark); color: #f5f4f0; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
.takeaway-label { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: #888780; margin-bottom: 6px; }
.takeaway-text { font-size: 14px; line-height: 1.6; color: #e8e7e3; }

/* Archive */
.archive-item { background: var(--surface); border-radius: 12px; border: 0.5px solid var(--border); margin-bottom: 8px; overflow: hidden; }
.archive-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; cursor: pointer; user-select: none; }
.archive-date { font-size: 14px; font-weight: 500; }
.archive-preview { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.archive-chevron { font-size: 14px; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
.archive-chevron.open { transform: rotate(180deg); }
.archive-body { display: none; padding: 0 16px 14px; border-top: 0.5px solid var(--border); }
.archive-body.open { display: block; }
.archive-body .section { margin-top: 14px; }
.archive-body .takeaway { margin-top: 14px; margin-bottom: 0; }

/* Watchlist */
.watchlist-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.watchlist-sub { font-size: 13px; color: var(--muted); }
.add-btn {
  background: var(--dark); color: #f5f4f0; border: none; border-radius: 10px;
  padding: 9px 16px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit;
}
.wl-card { background: var(--surface); border-radius: 12px; border: 0.5px solid var(--border); padding: 14px 16px; margin-bottom: 8px; }
.wl-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.wl-card-name { font-size: 14px; font-weight: 500; }
.wl-card-btns { display: flex; gap: 10px; }
.wl-btn { background: none; border: none; cursor: pointer; font-size: 15px; padding: 0; color: var(--muted); }
.wl-status { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; margin-top: 6px; }
.s-watching  { background: #FAEEDA; color: #854F0B; }
.s-open      { background: #EAF3DE; color: #3B6D11; }
.s-contacted { background: #E6F1FB; color: #185FA5; }
.s-pitched   { background: #EEEDFE; color: #4B3A9E; }
.s-closed    { background: #FCEBEB; color: #A32D2D; }
.wl-note { font-size: 12px; color: #555; margin-top: 8px; font-style: italic; line-height: 1.5; }
.wl-added { font-size: 11px; color: var(--muted); margin-top: 6px; }

/* Empty & utility */
.empty-state { background: var(--surface); border-radius: 12px; border: 0.5px solid var(--border); padding: 32px 20px; text-align: center; }
.empty-icon { font-size: 32px; margin-bottom: 12px; }
.empty-title { font-size: 15px; font-weight: 500; margin-bottom: 8px; }
.empty-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }
.no-results { text-align: center; font-size: 13px; color: var(--muted); padding: 28px 0; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: flex; align-items: flex-end; justify-content: center; z-index: 100;
}
.modal-sheet {
  background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 20px 20px calc(var(--safe-bottom) + 24px);
  width: 100%; max-width: 480px;
}
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
.modal-title { font-size: 16px; font-weight: 500; margin-bottom: 2px; }
.modal-sub { font-size: 12px; color: var(--muted); margin-bottom: 16px; text-transform: capitalize; }
.modal-label { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
.modal-input {
  width: 100%; border: 0.5px solid var(--border); border-radius: 10px;
  padding: 12px; font-size: 14px; font-family: inherit; color: var(--dark);
  background: var(--bg); outline: none; margin-bottom: 14px;
}
.modal-textarea {
  width: 100%; border: 0.5px solid var(--border); border-radius: 10px;
  padding: 12px; font-size: 14px; font-family: inherit; color: var(--dark);
  background: var(--bg); resize: none; outline: none; margin-bottom: 16px;
  line-height: 1.5; min-height: 80px;
}
.modal-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.modal-pill {
  font-size: 12px; font-weight: 500; padding: 6px 14px; border-radius: 20px;
  cursor: pointer; user-select: none; border: 1px solid var(--border);
  background: var(--surface); color: var(--muted); transition: all 0.15s;
}
.modal-pill.active { background: var(--dark); color: #f5f4f0; border-color: var(--dark); }
.modal-btns { display: flex; gap: 8px; }
.btn-save {
  flex: 1; background: var(--dark); color: #f5f4f0; border: none; border-radius: 10px;
  padding: 13px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit;
}
.btn-cancel {
  background: var(--bg); color: var(--dark); border: 0.5px solid var(--border);
  border-radius: 10px; padding: 13px 20px; font-size: 14px; font-weight: 500;
  cursor: pointer; font-family: inherit;
}

.divider { height: 0.5px; background: var(--border); margin: 20px 0; }
.footer-text { font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">Blotto Games</div>
  <div class="title">Weekly Research</div>
</div>

<div class="tabs">
  <div class="tab active" id="tab-this"      onclick="switchTab('this')">This Week</div>
  <div class="tab"        id="tab-archive"   onclick="switchTab('archive')">Archive</div>
  <div class="tab"        id="tab-saved"     onclick="switchTab('saved')">Saved</div>
  <div class="tab"        id="tab-watchlist" onclick="switchTab('watchlist')">Watchlist</div>
</div>

<!-- THIS WEEK -->
<div id="view-this">
  <div class="filter-row">
    <div class="filter-pill active" data-f="all" onclick="setFilter('all')">All</div>
    <div class="filter-pill" data-f="dd" onclick="setFilter('dd')">Drunk Detective</div>
    <div class="filter-pill" data-f="bf" onclick="setFilter('bf')">Bar Fight</div>
    <div class="filter-pill" data-f="ff" onclick="setFilter('ff')">Fixed Fight</div>
  </div>
  <div class="badge badge-green"><div class="dot"></div><span>Updates every Monday at 8am</span></div>
  <div class="week-label" id="week-label"></div>
  <div id="content-this"></div>
</div>

<!-- ARCHIVE -->
<div id="view-archive" style="display:none">
  <div class="search-bar">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="search-input" placeholder="Search archive…" oninput="renderArchive()">
  </div>
  <div id="content
